[project]
name = "sentinel"
version = "0.9.0"
description = "AI-assisted context-aware web application security testing and vulnerability verification platform (authorized use only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See LICENSE" }
authors = [{ name = "Project owner" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
sentinel = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mypy",
    "ruff",
]
browser = [
    "playwright>=1.40",
]
websocket = [
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = ["Test*Suite", "Test_*"]  # avoid pytest trying to collect app classes like TestOrchestrator

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
