# Example SENTINEL scan configuration (Phase 0 placeholder shape — finalized in Phase 1)

target:
  name: "example-authorized-target"
  scope:
    allow:
      - "https://app.example-authorized-target.test"
    deny: []
  seed_urls:
    - "https://app.example-authorized-target.test/"
  # Optional — enables real cross-identity IDOR/BOLA testing (Phase 8). Credential
  # VALUES are never written here — only the name of an environment variable that
  # must hold the actual value at scan time (e.g. `export SENTINEL_AUTH_USER_A="Bearer ..."`).
  # auth_contexts:
  #   - label: user_a
  #     kind: header       # header | cookie
  #     name: Authorization
  #     env_var: SENTINEL_AUTH_USER_A
  #   - label: user_b
  #     kind: header
  #     name: Authorization
  #     env_var: SENTINEL_AUTH_USER_B

scan:
  mode: passive   # passive | safe | active

limits:
  requests_per_second: 5
  concurrency: 3
  max_requests: 10000
  max_crawl_depth: 5

llm:
  provider: ollama
  model: "CHANGE_ME"
  base_url: "http://localhost:11434"
  temperature: 0
