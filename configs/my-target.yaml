target:
  name: "my-test-target"
  scope:
    allow:
      - "https://emis.cehrd.gov.np"# <-- your actual authorized target
    deny: []
  seed_urls:
    - "https://emis.cehrd.gov.np/" # <-- where the crawler starts

scan:
  mode: active # start with passive, escalate deliberately — see below

limits:
  requests_per_second: 5
  concurrency: 3
  max_requests: 500000
  max_crawl_depth: 10

llm:
  provider: ollama
  model: "llama3.1:8b-instruct-q4_K_M" # only matters if you're running Ollama
  base_url: "http://localhost:11434"
  temperature: 0

storage_path: "my-target.db" # separate DB file per target, recommended
log_level: "INFO"
